<header style="background-color: rgb(252, 80, 17)" class="app-header">
  <div class="topbar">
    <a routerLink="/dash">Dashboard</a>
    <a routerLink="/admin">Become a Seller</a>
    <a routerLink="/contact">Help and Support</a>
    <a routerLink="/login">Login</a>
    <a routerLink="/register">Sign Up</a>
  </div>

  <div class="navrow">
    <div style="color: white" class="logo">Daraz</div>

    <form class="search" role="search" (ngSubmit)="onSearchSubmit($event)">
      <input
        type="text"
        placeholder="Search notebooks, inks, desk goods…"
        name="searchQuery"
        [ngModel]="searchValue"
        (ngModelChange)="onSearchInput($event)"
      />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>

    <a routerLink="/cart" class="cart-btn" aria-label="Cart">
      <svg viewBox="0 0 24 24"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4" fill="var(--ink)"/><circle cx="18" cy="20" r="1.4" fill="var(--ink)"/></svg>
      <span class="cart-count">3</span>
    </a>
  </div>

  <div class="stitch"></div>
</header>
