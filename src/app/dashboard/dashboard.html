<div class="dashboard-layout">
  <main class="main-content">
    <header class="dashboard-header">
      <section class="dashboard-header-inner">
        <p>Ecommerce</p>
        <search>
          <form id="searchForm" (ngSubmit)="onSearchSubmit($event)">
            <input
              type="search"
              id="searchInput"
              name="searchInput"
              placeholder="Search here..."
              aria-label="Search through site content"
              [ngModel]="searchInput()"
              (ngModelChange)="searchInput.set($event)"
            />
            <button type="submit">Search</button>
          </form>
        </search>
        <span>Browse categories</span>
      </section>
    </header>

    <section class="dashboard-products">
      <p *ngIf="categoryCount() === 0 && !searchInput().trim()" class="empty-state">
        No categories are available yet.
      </p>

      <div *ngIf="searchInput().trim() && matchingProducts().length === 0" class="empty-state">
        No products match your search yet.
      </div>

      <div *ngIf="searchInput().trim() && matchingProducts().length > 0" class="product-grid">
        <article *ngFor="let product of matchingProducts()" class="product-card">
          <div class="product-info">
            <h2>{{ product.name }}</h2>
            <p class="price">${{ product.price.toFixed(2) }}</p>
            <p>{{ product.description || 'No description available' }}</p>
          </div>
          <div class="product-actions">
            <a [routerLink]="['/product', product.id]">View details</a>
          </div>
        </article>
      </div>

      <div *ngIf="!searchInput().trim() && categoryCount() > 0" class="category-list">
        <a
          *ngFor="let category of categories()"
          class="category-link"
          [routerLink]="['/category']"
          [queryParams]="{ category: category }"
        >
          <span>{{ category }}</span>
        </a>
      </div>
    </section>
  </main>
</div>
