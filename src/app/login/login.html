<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <mat-card>
      <mat-card-header>
        <h2>Login Form</h2>
      </mat-card-header>
      <mat-card-content>
        <form #loginForm="ngForm" (ngSubmit)="login()">
          <!-- Error Message -->
          <mat-error *ngIf="!loginValid">Incorrect email or password.</mat-error>

          <!-- Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="user.email" placeholder="Email" name="email" required>
            <mat-icon matSuffix>email</mat-icon>
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [(ngModel)]="user.password" placeholder="Password" name="password" type="password" required>
            <mat-icon matSuffix>lock</mat-icon>
          </mat-form-field>

          <!-- Login Button -->
          <button mat-raised-button color="primary" class="full-width" [disabled]="!loginForm.form.valid">
            Login
          </button>

          <!-- Extra Links -->
          <div class="extra-links">
            <a href="/forgot-password">Forgot password?</a>
            <a href="/register">New user? Create account</a>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</body>
</html>
