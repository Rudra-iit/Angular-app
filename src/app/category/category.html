<div class="category-page">
  <app-header
    [searchValue]="searchInput()"
    (searchValueChange)="searchInput.set($event)"
    (searchSubmitted)="onSearchSubmit($event)"
  ></app-header>

  <div class="category-shell">
    <aside class="category-sidebar">
      <h2>Categories</h2>
      <a
        *ngFor="let category of categoryLinks()"
        class="category-link"
        [class.active]="selectedCategory() === category"
        [routerLink]="['/category']"
        [queryParams]="{ category }"
      >
        {{ category }}
      </a>
    </aside>

    <div class="category-main">
      <h1>{{ selectedCategory() }}</h1>

      <p *ngIf="categoryProducts().length === 0">No products match your search yet.</p>

      <div *ngIf="categoryProducts().length > 0" class="product-grid">
        <article *ngFor="let product of categoryProducts()" class="product-card">
          <img *ngIf="product.imageUrl" [src]="product.imageUrl" [alt]="product.name" />
          <div class="product-info">
            <h2>{{ product.name }}</h2>
            <p class="price">${{ product.price.toFixed(2) }}</p>
            <p>{{ product.description || 'No description available' }}</p>
          </div>
          <div class="product-actions">
            <a [routerLink]="['/product', product.id]">View details</a>
            <a [routerLink]="['/product', product.id]" [queryParams]="{ buy: true }">Buy now</a>
            <button type="button" (click)="addToCart(product.id)">Add to cart</button>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>
